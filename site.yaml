about:
  - >-
    I am a policy analyst focused on economic analysis and development, working
    where data, public finance, and international development meet. I hold an MPP from the
    University of Chicago's Harris School of Public Policy and currently work as a
    Data and Policy Analyst at the Cook County Bureau of Economic Development.
  - >-
    My work asks whether public programs deliver what they promise and who bears
    the costs. I have evaluated a school feeding program across four countries for
    the World Bank, measured how Tax Increment Financing reshapes Chicago's tax
    base, designed a behavioral intervention against child labor in Kenya, and
    modeled credit access for farmers in India. Along the way I have worked with
    UNDP on data governance, and with federal health data in economic consulting.
  - >-
    I work across the full analytical stack — Python, R, Stata, SAS, SQL, and
    D3.js — from causal inference and program evaluation to maps, dashboards, and
    interactive tools that make evidence usable for policymakers and the public.
