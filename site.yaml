about:
  - >-
    I am a data analyst and policy researcher with an MPP from the University of
    Chicago's Harris School of Public Policy. I specialize in turning large-scale
    administrative data into decisions, with experience working on Centers for
    Medicare and Medicaid Services data, evaluating food security interventions for
    the World Bank, and modeling rural credit access for farmers in India.
  - >-
    My work spans economic consulting, international development, and public
    finance, with a focus on causal inference and program evaluation in emerging
    markets and federal policy contexts.
  - >-
    I work across the full analytical stack — SAS, Stata, R, Python, SQL, and D3.js —
    building everything from federal deliverables and RCT analyses to interactive
    data visualizations that make complex findings accessible to policymakers and
    the public.
