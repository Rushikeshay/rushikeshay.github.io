baseURL = "https://rushikeshay.github.io/"
languageCode = "en-us"
title = "Rushikesh Jadhav"
theme = "PaperMod"

[params]
  description = "Data Visualization for Public Policy Portfolio"
  
  # Profile mode for homepage. Reference: https://github.com/adityatelange/hugo-PaperMod/wiki/Features#profile-mode
  [params.profileMode]
    enabled = true
    title = "Rushikesh Jadhav"
    subtitle = "Policy Research & Data Analysis"
    imageUrl = "/photo.jpg"
    imageTitle = "Profile Picture"
    imageWidth = 300
    imageHeight = 300
    
    [[params.profileMode.buttons]]
      name = "Projects"
      url = "/projects"
    
    [[params.profileMode.buttons]]
      name = "About"
      url = "/about"
      
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/rushikeshay"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/rushikesh-jadhav-mpp"
    
  [[params.socialIcons]]
    name = "email"
    url = "mailto:jadhav@uchicago.edu"

  # Additional params
  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = false
  UseHugoToc = true
  disableSpecial1stPost = false
  disableScrollToTop = false
  hidemeta = false
  hideSummary = false
  showtoc = false
  tocopen = false

[menu]
  [[menu.main]]
    name = "Home"
    url = "#home"
    weight = 1

  [[menu.main]]
    name = "Apps & Tools"
    url = "#projects"
    weight = 2

  [[menu.main]]
    name = "Research"
    url = "#research"
    weight = 3

  [[menu.main]]
    name = "Publications"
    url = "#publications"
    weight = 4

  [[menu.main]]
    name = "About"
    url = "#about"
    weight = 5

  [[menu.main]]
    name = "Contact"
    url = "#contact"
    weight = 6

[outputs]
  home = ["HTML", "RSS", "JSON"]