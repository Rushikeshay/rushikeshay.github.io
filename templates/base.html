<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.name }} — {{ site.role }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ site.intro }}{% endblock %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="{{ base }}css/site.css">
</head>
<body class="{% block bodyclass %}{% endblock %}">
  <a class="skip" href="#main">Skip to content</a>
  <header class="masthead wrap">
    <a class="wordmark" href="{{ base }}">{{ site.name }}<span>{{ site.role }}</span></a>
    <nav aria-label="Main">
      <a href="{{ base }}#work">Work</a>
      <a href="{{ base }}#publications">Publications</a>
      <a href="{{ base }}#about">About</a>
      <a class="nav-cv" href="{{ base }}{{ site.cv }}">CV ↓</a>
    </nav>
  </header>

  <main id="main">{% block main %}{% endblock %}</main>

  <footer class="colophon wrap">
    <p>{{ site.name }} · <a href="mailto:{{ site.email }}">{{ site.email }}</a></p>
    <p><a href="{{ site.github }}">GitHub</a> · <a href="{{ site.linkedin }}">LinkedIn</a></p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
